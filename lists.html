<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered list </h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <h1>Ordered list </h1>
    <ol>
        <li>paris</li>
        <li>london</li>
        <li>new york</li>
    </ol>
    <h1>Definition list</h1>
    <dl>
        <h3><dt>Family Name</dt></h3>
        <dd>shreyas</dd>
        <dd>Swapnil</dd>
        <dd>mom</dd>
        <dd>dad</dd>

    </dl>
    <h1>Nested list</h1>
    <ul>
        <li>
            <h3>Fruits</h3>
            <ul>
                <li>apple</li>
                <li>banana</li>
                <li>grapes</li>
            </ul>
        </li>
    </ul>

    
</body>
</html>
